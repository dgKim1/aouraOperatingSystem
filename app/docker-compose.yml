# 로컬 개발용 Postgres (axhub 배포와 무관). 사용: docker compose up -d
# 접속 예: DATABASE_URL=postgres://aoura:aoura@localhost:5433/aoura  (로컬 전용 계정 — 운영 비밀값 아님)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: aoura
      POSTGRES_PASSWORD: aoura
      POSTGRES_DB: aoura
    ports:
      - '5433:5432'
    volumes:
      - aoura-pg:/var/lib/postgresql/data
volumes:
  aoura-pg:
